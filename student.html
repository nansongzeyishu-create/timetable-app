<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生徒用時間割・スケジュール管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .modal { transition: opacity 0.2s ease, transform 0.2s ease; }
        body.modal-active { overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col pb-20 md:pb-0 md:pl-64 select-none">

    <!-- Auth View (Hidden when logged in) -->
    <div id="authView" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 text-center space-y-6">
            <div class="bg-indigo-100 text-indigo-600 p-4 rounded-full inline-block">
                <i data-lucide="book-open" class="w-10 h-10"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-800" id="authTitle">ログイン</h1>
                <p class="text-slate-500 text-xs mt-1" id="authSubtitle">メールアドレスを入力してスタート</p>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <input type="email" id="authEmail" required class="w-full px-4 py-3 border border-slate-200 rounded-xl text-center focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="student@example.com">
                <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition">
                    ログイン
                </button>
            </form>

            <button type="button" onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-xs text-indigo-600 font-medium">
                新規アカウント作成はこちら
            </button>
        </div>
    </div>

    <!-- Sidebar / Navigation (Desktop fallback) -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 fixed inset-y-0 left-0 z-30">
        <div class="p-6 border-b border-slate-100 flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="calendar" class="w-6 h-6"></i>
            </div>
            <div>
                <h2 class="font-bold text-slate-800">スクール手帳</h2>
                <span class="text-xs text-indigo-600 font-medium truncate max-w-[140px] block" id="userEmailBadge"></span>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('home')" id="nav-home-dt" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-indigo-600 bg-indigo-50 transition">
                <i data-lucide="home" class="w-5 h-5"></i><span>ホーム</span>
            </button>
            <button onclick="switchTab('calendar')" id="nav-calendar-dt" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition">
                <i data-lucide="calendar-days" class="w-5 h-5"></i><span>カレンダー</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings-dt" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition">
                <i data-lucide="settings" class="w-5 h-5"></i><span>設定</span>
            </button>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <button onclick="requestLogout()" class="w-full flex items-center justify-center space-x-2 text-rose-600 hover:bg-rose-50 p-3 rounded-xl text-sm font-bold transition">
                <i data-lucide="log-out" class="w-4 h-4"></i><span>ログアウト</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full">
        <!-- MOBILE HEADER: Large Date Display -->
        <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4 flex justify-between items-center">
            <div>
                <span class="text-xs font-bold text-indigo-600 tracking-wider uppercase">TODAY</span>
                <h1 class="text-2xl font-extrabold text-slate-900 leading-tight" id="currentDateStr">2026年11月5日(木)</h1>
            </div>
            <button onclick="openMasterTimetableModal()" class="p-2.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-xl font-bold text-xs flex items-center gap-1">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
                <span class="hidden sm:inline">時間割設定</span>
            </button>
        </header>

        <!-- TAB CONTENT: HOME (WEEKLY / DAILY TIMETABLE) -->
        <section id="tab-home" class="space-y-4">
            <!-- Day Selector Tabs (Mon to Sun) -->
            <div class="bg-white rounded-2xl p-2 shadow-sm border border-slate-200 flex justify-between gap-1 overflow-x-auto no-scrollbar" id="dayTabContainer">
                <!-- Tabs generated dynamically -->
            </div>

            <!-- Single Day Timetable List -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="font-extrabold text-slate-800 text-base flex items-center gap-2" id="selectedDayTitle">
                        <i data-lucide="clock" class="w-4 h-4 text-indigo-500"></i> 今日の授業
                    </h2>
                    <span id="selectedDayHolidayBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 hidden">祝日</span>
                </div>

                <!-- Timetable Items 1 to 7 -->
                <div id="dailyPeriodList" class="space-y-2">
                    <!-- Period items populated dynamically -->
                </div>
            </div>

            <!-- Mobile Summary Cards -->
            <div class="space-y-3">
                <!-- Today Belongings -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-2">
                        <span class="p-1 bg-purple-100 text-purple-600 rounded-lg"><i data-lucide="briefcase" class="w-3.5 h-3.5"></i></span>
                        本日の持ち物
                    </h3>
                    <ul id="todayBelongingsList" class="space-y-1.5 text-xs text-slate-600">
                        <li class="text-slate-400 italic">本日の持ち物はありません</li>
                    </ul>
                </div>

                <!-- Upcoming Assignments -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 mb-2">
                        <span class="p-1 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="file-check-2" class="w-3.5 h-3.5"></i></span>
                        近日提出の課題 (1週間以内)
                    </h3>
                    <ul id="upcomingAssignmentsList" class="space-y-1.5 text-xs text-slate-600">
                        <li class="text-slate-400 italic">提出が必要な課題はありません</li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- TAB CONTENT: CALENDAR -->
        <section id="tab-calendar" class="hidden space-y-4">
            <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex justify-between items-center">
                <button onclick="changeMonth(-1)" class="p-2 rounded-xl border hover:bg-slate-50 text-slate-600">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <h2 id="calendarMonthLabel" class="text-base font-extrabold text-slate-800">2026年 11月</h2>
                <button onclick="changeMonth(1)" class="p-2 rounded-xl border hover:bg-slate-50 text-slate-600">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Calendar Grid -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="grid grid-cols-7 border-b border-slate-100 bg-slate-50 text-center text-xs font-bold py-2.5 text-slate-500">
                    <span class="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-blue-500">土</span>
                </div>
                <div id="calendarDaysGrid" class="grid grid-cols-7 divide-x divide-y divide-slate-100 min-h-[320px]">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </section>

        <!-- TAB CONTENT: SETTINGS -->
        <section id="tab-settings" class="hidden space-y-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-5">
                <div>
                    <h3 class="font-bold text-slate-800 text-sm border-b pb-2 mb-3">アカウント</h3>
                    <p class="text-xs text-slate-600">ログイン中: <span id="settingsUserEmail" class="font-bold text-indigo-600"></span></p>
                </div>

                <div>
                    <h3 class="font-bold text-slate-800 text-sm border-b pb-2 mb-3">データのリセット</h3>
                    <div class="space-y-3">
                        <button onclick="confirmResetMasterTimetable()" class="w-full py-2.5 bg-rose-50 text-rose-700 hover:bg-rose-100 font-bold rounded-xl text-xs transition">
                            基本時間割をクリア
                        </button>
                        <button onclick="confirmResetAllData()" class="w-full py-2.5 bg-rose-600 text-white hover:bg-rose-700 font-bold rounded-xl text-xs shadow-md transition">
                            すべてのデータを初期化
                        </button>
                    </div>
                </div>

                <div class="border-t pt-4">
                    <button onclick="requestLogout()" class="w-full py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs transition">
                        ログアウト
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation (Mobile Native Feel) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 flex justify-around py-2 shadow-2xl">
        <button onclick="switchTab('home')" id="nav-home-mb" class="flex flex-col items-center space-y-1 text-indigo-600">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">ホーム</span>
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar-mb" class="flex flex-col items-center space-y-1 text-slate-400">
            <i data-lucide="calendar-days" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">カレンダー</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings-mb" class="flex flex-col items-center space-y-1 text-slate-400">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">設定</span>
        </button>
    </nav>

    <!-- MODAL 1: Master Timetable Edit (Bottom Sheet Mobile) -->
    <div id="masterTimetableModal" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-xl max-w-lg w-full max-h-[85vh] flex flex-col">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-3xl sm:rounded-t-2xl">
                <h3 class="font-bold text-slate-800 text-base">基本時間割の編集</h3>
                <button onclick="closeMasterTimetableModal()" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4 flex-1">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">曜日</label>
                        <select id="mtDaySelect" class="w-full px-3 py-2.5 border rounded-xl text-xs bg-white">
                            <option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option>
                            <option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option><option value="0">日曜日</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">時限</label>
                        <select id="mtPeriodSelect" class="w-full px-3 py-2.5 border rounded-xl text-xs bg-white">
                            <option value="1">1限</option><option value="2">2限</option><option value="3">3限</option>
                            <option value="4">4限</option><option value="5">5限</option><option value="6">6限</option><option value="7">7限</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">教科名</label>
                    <input type="text" id="mtSubjectInput" class="w-full px-3 py-2.5 border rounded-xl text-xs" placeholder="例: 数学I">
                </div>
                <div class="pt-2 flex gap-3">
                    <button onclick="confirmResetMasterTimetable()" class="flex-1 py-2.5 bg-rose-50 text-rose-700 font-bold rounded-xl text-xs">全クリア</button>
                    <button onclick="saveMasterTimetableCell()" class="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow-md">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: Day Detail & Edit (Calendar Day Click / Bottom Sheet) -->
    <div id="dayDetailModal" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-xl max-w-lg w-full max-h-[85vh] flex flex-col">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-3xl sm:rounded-t-2xl">
                <div>
                    <h3 id="dayDetailModalTitle" class="font-extrabold text-slate-800 text-base">2026年11月5日</h3>
                    <p id="dayDetailModalSubtitle" class="text-[10px] font-bold text-rose-500"></p>
                </div>
                <button onclick="closeDayDetailModal()" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-4 flex-1">
                <div>
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">登録されている予定</h4>
                    <div id="dayEventsList" class="space-y-2"></div>
                </div>

                <div class="border-t pt-3">
                    <h4 class="text-xs font-bold text-slate-700 mb-2">新規追加</h4>
                    <div class="space-y-3">
                        <select id="eventTypeSelect" onchange="toggleEventTypeFields()" class="w-full px-3 py-2 border rounded-xl text-xs bg-white font-bold">
                            <option value="change">🚨 時間割変更</option>
                            <option value="belonging">🎒 持ち物</option>
                            <option value="assignment">📝 課題提出日</option>
                        </select>

                        <div id="fieldTimetableChange" class="grid grid-cols-2 gap-2">
                            <select id="changePeriodSelect" class="w-full px-3 py-2 border rounded-xl text-xs bg-white">
                                <option value="1">1限</option><option value="2">2限</option><option value="3">3限</option>
                                <option value="4">4限</option><option value="5">5限</option><option value="6">6限</option><option value="7">7限</option>
                            </select>
                            <input type="text" id="changeSubjectInput" class="w-full px-3 py-2 border rounded-xl text-xs" placeholder="変更後の教科">
                        </div>

                        <div id="fieldBelonging" class="hidden">
                            <input type="text" id="belongingInput" class="w-full px-3 py-2 border rounded-xl text-xs" placeholder="持ち物の内容">
                        </div>

                        <div id="fieldAssignment" class="hidden space-y-2">
                            <input type="text" id="assignmentTitleInput" class="w-full px-3 py-2 border rounded-xl text-xs" placeholder="課題名">
                            <input type="time" id="assignmentTimeInput" value="08:40" class="w-full px-3 py-2 border rounded-xl text-xs">
                        </div>

                        <button onclick="requestAddDayEvent()" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow-md">
                            追加する
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 3: Confirm Dialog -->
    <div id="confirmModal" class="modal opacity-0 pointer-events-none fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl max-w-xs w-full p-5 text-center space-y-3">
            <div class="mx-auto w-10 h-10 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-5 h-5"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-slate-800" id="confirmModalTitle">確認</h3>
                <p class="text-xs text-slate-500 mt-1" id="confirmModalMsg">実行してもよろしいですか？</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeConfirmModal(false)" class="w-full py-2 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">キャンセル</button>
                <button id="confirmExecuteBtn" class="w-full py-2 bg-rose-600 text-white font-bold rounded-xl text-xs shadow-md">OK</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        let currentUser = null;
        let selectedCalendarDate = new Date();
        let selectedDayTabNum = new Date().getDay(); // 0-6
        let activeDayKey = null;
        let confirmActionCallback = null;

        const STORAGE_KEY_USER = 'timetable_app_user';
        const STORAGE_KEY_MASTER = 'timetable_app_master';
        const STORAGE_KEY_EVENTS = 'timetable_app_events';

        let masterTimetable = {
            1: { 1: "国語", 2: "数学", 3: "英語", 4: "理科", 5: "社会", 6: "体育" },
            2: { 1: "数A", 2: "英単", 3: "物理", 4: "化学", 5: "歴史", 6: "保健", 7: "総合" },
            3: { 1: "音楽", 2: "美術", 3: "国語", 4: "数学", 5: "英語", 6: "クラブ" },
            4: { 1: "地理", 2: "体育", 3: "数学", 4: "理科", 5: "英語", 6: "道徳" },
            5: { 1: "英語", 2: "国語", 3: "情報", 4: "数学", 5: "理科", 6: "LHR" },
            6: {}, 0: {}
        };
        let dayEvents = {};

        function getJapaneseHolidays(year) {
            const holidays = {};
            const add = (m, d, name) => holidays[`${year}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`] = name;
            add(1, 1, "元日"); add(2, 11, "建国記念の日"); add(2, 23, "天皇誕生日");
            add(4, 29, "昭和の日"); add(5, 3, "憲法記念日"); add(5, 4, "みどりの日"); add(5, 5, "こどもの日");
            add(8, 11, "山の日"); add(11, 3, "文化の日"); add(11, 23, "勤労感謝の日");
            
            const getNthMonday = (month, nth) => {
                let count = 0;
                for (let d = 1; d <= 31; d++) {
                    const date = new Date(year, month - 1, d);
                    if (date.getMonth() !== month - 1) break;
                    if (date.getDay() === 1 && ++count === nth) return d;
                }
                return 1;
            };
            add(1, getNthMonday(1, 2), "成人の日"); add(7, getNthMonday(7, 3), "海の日");
            add(9, getNthMonday(9, 3), "敬老の日"); add(10, getNthMonday(10, 2), "スポーツの日");
            return holidays;
        }

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadStoredData();
            checkAuthStatus();
            renderHeaderDate();
        });

        function loadStoredData() {
            const storedMaster = localStorage.getItem(STORAGE_KEY_MASTER);
            if (storedMaster) try { masterTimetable = JSON.parse(storedMaster); } catch(e){}
            const storedEvents = localStorage.getItem(STORAGE_KEY_EVENTS);
            if (storedEvents) try { dayEvents = JSON.parse(storedEvents); } catch(e){}
        }

        function saveMasterData() { localStorage.setItem(STORAGE_KEY_MASTER, JSON.stringify(masterTimetable)); }
        function saveEventsData() { localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(dayEvents)); }

        function checkAuthStatus() {
            const savedEmail = localStorage.getItem(STORAGE_KEY_USER);
            if (savedEmail) {
                currentUser = savedEmail;
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('userEmailBadge').innerText = currentUser;
                document.getElementById('settingsUserEmail').innerText = currentUser;
                renderWeeklyTimetable();
                renderCalendar();
            } else {
                document.getElementById('authView').classList.remove('hidden');
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            if (email) {
                localStorage.setItem(STORAGE_KEY_USER, email);
                checkAuthStatus();
            }
        }

        function requestLogout() {
            openConfirmModal("ログアウトしますか？", "データへのアクセスが停止します。", () => {
                localStorage.removeItem(STORAGE_KEY_USER);
                currentUser = null;
                checkAuthStatus();
            });
        }

        function renderHeaderDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            document.getElementById('currentDateStr').innerText = now.toLocaleDateString('ja-JP', options);
        }

        function switchTab(tabName) {
            ['home', 'calendar', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                const mbBtn = document.getElementById(`nav-${tab}-mb`);
                if (mbBtn) mbBtn.className = tab === tabName ? "flex flex-col items-center space-y-1 text-indigo-600" : "flex flex-col items-center space-y-1 text-slate-400";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            if (tabName === 'home') renderWeeklyTimetable();
            if (tabName === 'calendar') renderCalendar();
        }

        function renderWeeklyTimetable() {
            const today = new Date();
            const currentDayOfWeek = today.getDay();
            const mondayOffset = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            const monday = new Date(today); monday.setDate(today.getDate() + mondayOffset);
            const holidays = getJapaneseHolidays(today.getFullYear());

            const weekDates = {};
            const dayTabContainer = document.getElementById('dayTabContainer');
            dayTabContainer.innerHTML = '';

            const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
            const order = [1, 2, 3, 4, 5, 6, 0];

            order.forEach(dayNum => {
                const dayDate = new Date(monday);
                const offset = dayNum === 0 ? 6 : dayNum - 1;
                dayDate.setDate(monday.getDate() + offset);
                const dateKey = formatDateKey(dayDate);
                weekDates[dayNum] = { date: dayDate, dateKey: dateKey, holiday: holidays[dateKey] };

                const isSelected = selectedDayTabNum === dayNum;
                const tabBtn = document.createElement('button');
                tabBtn.onclick = () => { selectedDayTabNum = dayNum; renderWeeklyTimetable(); };
                tabBtn.className = `flex-1 py-2 rounded-xl text-center flex flex-col items-center transition ${isSelected ? 'bg-indigo-600 text-white shadow-md font-extrabold' : 'hover:bg-slate-50 text-slate-600 font-bold'}`;
                tabBtn.innerHTML = `
                    <span class="text-[10px] opacity-80">${dayDate.getMonth()+1}/${dayDate.getDate()}</span>
                    <span class="text-xs">${dayNames[dayNum]}</span>
                `;
                dayTabContainer.appendChild(tabBtn);
            });

            const activeInfo = weekDates[selectedDayTabNum];
            document.getElementById('selectedDayTitle').innerText = `${dayNames[selectedDayTabNum]}曜日の授業 (${activeInfo.date.getMonth()+1}/${activeInfo.date.getDate()})`;

            const holidayBadge = document.getElementById('selectedDayHolidayBadge');
            if (activeInfo.holiday) {
                holidayBadge.innerText = activeInfo.holiday;
                holidayBadge.classList.remove('hidden');
            } else {
                holidayBadge.classList.add('hidden');
            }

            const listEl = document.getElementById('dailyPeriodList');
            listEl.innerHTML = '';

            for (let p = 1; p <= 7; p++) {
                if (p === 7 && selectedDayTabNum !== 2) {
                    const events = dayEvents[activeInfo.dateKey] || [];
                    if (!events.some(e => e.type === 'change' && parseInt(e.period) === 7)) continue;
                }

                const eventsForDay = dayEvents[activeInfo.dateKey] || [];
                const changeEvent = eventsForDay.find(e => e.type === 'change' && parseInt(e.period) === p);
                const masterSubject = masterTimetable[selectedDayTabNum] ? masterTimetable[selectedDayTabNum][p] : '';

                const itemCard = document.createElement('div');
                itemCard.className = "flex items-center p-3 rounded-xl border text-xs justify-between";

                if (changeEvent) {
                    itemCard.className += " bg-rose-50 border-rose-200 text-rose-900";
                    itemCard.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="font-extrabold bg-rose-600 text-white px-2 py-0.5 rounded-lg text-[10px]">${p}限</span>
                            <span class="font-bold text-sm">${escapeHtml(changeEvent.subject)}</span>
                        </div>
                        <span class="text-[10px] font-extrabold text-rose-600 border border-rose-300 px-1.5 py-0.5 rounded">🚨 変更</span>
                    `;
                } else if (activeInfo.holiday) {
                    itemCard.className += " bg-slate-50 border-slate-100 text-slate-400";
                    itemCard.innerHTML = `<span class="font-bold text-slate-400">${p}限: 休校日 (祝日)</span>`;
                } else {
                    itemCard.className += " bg-slate-50/50 border-slate-200 text-slate-700";
                    itemCard.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-lg text-[10px]">${p}限</span>
                            <span class="font-bold text-sm">${masterSubject ? escapeHtml(masterSubject) : '<span class="text-slate-300 font-normal">-</span>'}</span>
                        </div>
                    `;
                }
                listEl.appendChild(itemCard);
            }

            renderTodaySummary();
        }

        function renderTodaySummary() {
            const todayKey = formatDateKey(new Date());
            const todayEvents = dayEvents[todayKey] || [];

            const belongingsList = document.getElementById('todayBelongingsList');
            const belongings = todayEvents.filter(e => e.type === 'belonging');
            if (belongings.length > 0) {
                belongingsList.innerHTML = belongings.map(b => `<li class="font-bold text-purple-900 bg-purple-50 p-2 rounded-lg border border-purple-100">🎒 ${escapeHtml(b.title)}</li>`).join('');
            } else {
                belongingsList.innerHTML = `<li class="text-slate-400 italic">持ち物はありません</li>`;
            }

            const upcomingList = document.getElementById('upcomingAssignmentsList');
            const today = new Date();
            const sevenDaysLater = new Date(); sevenDaysLater.setDate(today.getDate() + 7);

            let upcomingAssignments = [];
            Object.keys(dayEvents).forEach(dateKey => {
                const eventDate = new Date(dateKey);
                if (eventDate >= new Date(today.toDateString()) && eventDate <= sevenDaysLater) {
                    dayEvents[dateKey].filter(e => e.type === 'assignment').forEach(a => upcomingAssignments.push({ ...a, dateKey }));
                }
            });

            if (upcomingAssignments.length > 0) {
                upcomingList.innerHTML = upcomingAssignments.map(a => `
                    <li class="flex justify-between items-center bg-emerald-50 p-2 rounded-lg border border-emerald-100 text-emerald-900 font-bold">
                        <span>📝 ${escapeHtml(a.title)}</span>
                        <span class="text-[10px] bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded">${a.dateKey.slice(5)} ${a.time || ''}</span>
                    </li>
                `).join('');
            } else {
                upcomingList.innerHTML = `<li class="text-slate-400 italic">課題はありません</li>`;
            }
        }

        function renderCalendar() {
            const year = selectedCalendarDate.getFullYear();
            const month = selectedCalendarDate.getMonth();
            document.getElementById('calendarMonthLabel').innerText = `${year}年 ${month + 1}月`;

            const grid = document.getElementById('calendarDaysGrid');
            grid.innerHTML = '';
            const holidays = getJapaneseHolidays(year);
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dateKey = formatDateKey(dateObj);
                const dayOfWeek = dateObj.getDay();
                const isHoliday = !!holidays[dateKey];

                const dayCell = document.createElement('div');
                dayCell.className = "min-h-[60px] p-1 border-t border-slate-100 cursor-pointer flex flex-col justify-start";
                dayCell.onclick = () => openDayDetailModal(dateKey);

                let numClass = "text-slate-700 font-bold text-xs";
                if (dayOfWeek === 0 || isHoliday) numClass = "text-rose-600 font-bold text-xs";
                else if (dayOfWeek === 6) numClass = "text-blue-600 font-bold text-xs";

                let html = `<span class="${numClass}">${day}</span>`;
                const events = dayEvents[dateKey] || [];
                events.forEach(ev => {
                    if (ev.type === 'change') html += `<div class="w-2 h-2 rounded-full bg-rose-500 my-0.5"></div>`;
                    if (ev.type === 'belonging') html += `<div class="w-2 h-2 rounded-full bg-purple-500 my-0.5"></div>`;
                    if (ev.type === 'assignment') html += `<div class="w-2 h-2 rounded-full bg-emerald-500 my-0.5"></div>`;
                });
                dayCell.innerHTML = html;
                grid.appendChild(dayCell);
            }
        }

        function changeMonth(offset) {
            selectedCalendarDate.setMonth(selectedCalendarDate.getMonth() + offset);
            renderCalendar();
        }

        function openMasterTimetableModal() {
            document.getElementById('masterTimetableModal').classList.remove('opacity-0', 'pointer-events-none');
        }
        function closeMasterTimetableModal() {
            document.getElementById('masterTimetableModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function saveMasterTimetableCell() {
            const day = document.getElementById('mtDaySelect').value;
            const period = document.getElementById('mtPeriodSelect').value;
            const subject = document.getElementById('mtSubjectInput').value.trim();

            if (!masterTimetable[day]) masterTimetable[day] = {};
            masterTimetable[day][period] = subject;
            saveMasterData();
            renderWeeklyTimetable();
            closeMasterTimetableModal();
            document.getElementById('mtSubjectInput').value = '';
        }

        function confirmResetMasterTimetable() {
            openConfirmModal("時間割をクリアしますか？", "基本時間割が削除されます。", () => {
                masterTimetable = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {}, 6: {}, 0: {} };
                saveMasterData();
                renderWeeklyTimetable();
                closeMasterTimetableModal();
            });
        }

        function openDayDetailModal(dateKey) {
            activeDayKey = dateKey;
            const [y, m, d] = dateKey.split('-').map(Number);
            document.getElementById('dayDetailModalTitle').innerText = `${y}年${m}月${d}日`;
            renderDayEventsList();
            document.getElementById('dayDetailModal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeDayDetailModal() {
            document.getElementById('dayDetailModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function renderDayEventsList() {
            const listEl = document.getElementById('dayEventsList');
            const events = dayEvents[activeDayKey] || [];
            if (events.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 italic">予定はありません</p>`;
                return;
            }
            listEl.innerHTML = events.map((ev, i) => `
                <div class="flex justify-between items-center p-2 bg-slate-50 border rounded-xl text-xs font-bold">
                    <span>${ev.type === 'change' ? '🚨 '+ev.period+'限:'+escapeHtml(ev.subject) : ev.type === 'belonging' ? '🎒 '+escapeHtml(ev.title) : '📝 '+escapeHtml(ev.title)}</span>
                    <button onclick="requestDeleteEvent(${i})" class="text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function toggleEventTypeFields() {
            const type = document.getElementById('eventTypeSelect').value;
            document.getElementById('fieldTimetableChange').classList.toggle('hidden', type !== 'change');
            document.getElementById('fieldBelonging').classList.toggle('hidden', type !== 'belonging');
            document.getElementById('fieldAssignment').classList.toggle('hidden', type !== 'assignment');
        }

        function requestAddDayEvent() {
            openConfirmModal("追加しますか？", "選択した項目を登録します。", () => {
                const type = document.getElementById('eventTypeSelect').value;
                if (!dayEvents[activeDayKey]) dayEvents[activeDayKey] = [];
                if (type === 'change') {
                    dayEvents[activeDayKey].push({ id: Date.now(), type: 'change', period: document.getElementById('changePeriodSelect').value, subject: document.getElementById('changeSubjectInput').value.trim() || '変更なし' });
                } else if (type === 'belonging') {
                    const title = document.getElementById('belongingInput').value.trim();
                    if (title) dayEvents[activeDayKey].push({ id: Date.now(), type: 'belonging', title });
                } else if (type === 'assignment') {
                    const title = document.getElementById('assignmentTitleInput').value.trim();
                    if (title) dayEvents[activeDayKey].push({ id: Date.now(), type: 'assignment', title, time: document.getElementById('assignmentTimeInput').value });
                }
                saveEventsData();
                renderDayEventsList();
                renderCalendar();
                renderWeeklyTimetable();
            });
        }

        function requestDeleteEvent(index) {
            openConfirmModal("削除しますか？", "元に戻すことはできません。", () => {
                if (dayEvents[activeDayKey]) {
                    dayEvents[activeDayKey].splice(index, 1);
                    if (dayEvents[activeDayKey].length === 0) delete dayEvents[activeDayKey];
                    saveEventsData();
                    renderDayEventsList();
                    renderCalendar();
                    renderWeeklyTimetable();
                }
            });
        }

        function confirmResetAllData() {
            openConfirmModal("初期化しますか？", "全データが完全に削除されます。", () => {
                localStorage.clear();
                masterTimetable = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {}, 6: {}, 0: {} };
                dayEvents = {};
                renderWeeklyTimetable();
                renderCalendar();
            });
        }

        function openConfirmModal(title, msg, onExecute) {
            document.getElementById('confirmModalTitle').innerText = title;
            document.getElementById('confirmModalMsg').innerText = msg;
            confirmActionCallback = onExecute;
            document.getElementById('confirmModal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('confirmExecuteBtn').onclick = () => {
                if (confirmActionCallback) confirmActionCallback();
                closeConfirmModal(true);
            };
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
