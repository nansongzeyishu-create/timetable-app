<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間割アプリ</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #F0F4F8;
            color: #333333;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .theme-blue { background-color: #EBF5FF; border-color: #BBE1FA; }
        .theme-green { background-color: #E6FFFA; border-color: #B2F5EA; }
        .theme-orange { background-color: #FFF5F5; border-color: #FED7D7; }
        .theme-purple { background-color: #FAF5FF; border-color: #E9D8FD; }
        .theme-pink { background-color: #FFF0F5; border-color: #FED7E2; }
        .theme-yellow { background-color: #FEFCBF; border-color: #FAF089; }
    </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md h-screen sm:h-[844px] sm:rounded-[40px] sm:shadow-2xl bg-slate-50 flex flex-col relative overflow-hidden border border-slate-200">

        <main id="main-content" class="flex-1 overflow-y-auto pb-24 no-scrollbar">
            <!-- JavaScriptで動的生成 -->
        </main>

        <nav class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 px-4 py-2 flex justify-around items-center z-40 shadow-lg">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-500 transition-all">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[11px] font-bold">ホーム</span>
            </button>
            <button onclick="switchTab('timetable')" id="nav-timetable" class="flex flex-col items-center text-slate-400 transition-all">
                <i class="fa-solid fa-calendar-days text-xl mb-1"></i>
                <span class="text-[11px] font-bold">時間割</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-slate-400 transition-all">
                <i class="fa-solid fa-square-check text-xl mb-1"></i>
                <span class="text-[11px] font-bold">課題</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-slate-400 transition-all">
                <i class="fa-solid fa-table-cells text-xl mb-1"></i>
                <span class="text-[11px] font-bold">その他</span>
            </button>
        </nav>
    </div>

    <!-- 授業編集モーダル -->
    <div id="lesson-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-blue-500"></i> 授業の編集
            </h3>
            <input type="hidden" id="modal-day">
            <input type="hidden" id="modal-period">
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">教科名</label>
                    <input type="text" id="modal-subject" class="w-full bg-slate-100 rounded-xl px-4 py-2.5 text-sm font-bold border-none outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">担当教師</label>
                    <input type="text" id="modal-teacher" class="w-full bg-slate-100 rounded-xl px-4 py-2.5 text-sm border-none outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">教室・場所</label>
                    <input type="text" id="modal-room" class="w-full bg-slate-100 rounded-xl px-4 py-2.5 text-sm border-none outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">テーマカラー</label>
                    <select id="modal-color" class="w-full bg-slate-100 rounded-xl px-4 py-2.5 text-sm border-none outline-none">
                        <option value="blue">ブルー（水色）</option>
                        <option value="green">グリーン（ミント）</option>
                        <option value="orange">オレンジ（ピンク）</option>
                        <option value="purple">パープル（薄紫）</option>
                        <option value="yellow">イエロー（黄色）</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeModal('lesson-modal')" class="flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-sm">キャンセル</button>
                <button onclick="saveLesson()" class="flex-1 bg-blue-500 text-white font-bold py-3 rounded-xl text-sm shadow-md">保存する</button>
            </div>
        </div>
    </div>

    <!-- 持ち物編集モーダル -->
    <div id="items-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-blue-500"></i> 今日の持ち物 編集
            </h3>
            <p class="text-xs text-slate-400 mb-4">持ち物を追加または削除できます</p>
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-item-input" placeholder="新しい持ち物を入力..." class="flex-1 bg-slate-100 rounded-xl px-3 py-2 text-sm border-none outline-none">
                <button onclick="addQuickItem()" class="bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold">追加</button>
            </div>
            <div id="modal-items-list" class="space-y-2 max-h-48 overflow-y-auto mb-4"></div>
            <button onclick="closeModal('items-modal'); renderApp();" class="w-full bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-sm">閉じる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
