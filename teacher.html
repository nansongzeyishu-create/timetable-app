<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業登録（先生用）</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #eaf3fa;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background: #f4f9fd;
      border-radius: 30px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .teacher-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .teacher-card h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #334155;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
    }

    button.add-btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    .link-btn {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #3b82f6;
      text-decoration: none;
      font-size: 13px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">
    <div class="teacher-card">
      <h2>👩‍🏫 授業の登録</h2>
      
      <div class="form-group">
        <label>授業名</label>
        <input type="text" id="class-title" placeholder="例: 数学">
      </div>

      <div class="form-group">
        <label>曜日</label>
        <select id="class-day">
          <option value="月">月曜日</option>
          <option value="火">火曜日</option>
          <option value="水">水曜日</option>
          <option value="木" selected>木曜日</option>
          <option value="金">金曜日</option>
        </select>
      </div>

      <div class="form-group">
        <label>時限</label>
        <select id="class-period">
          <option value="1">1限</option>
          <option value="2">2限</option>
          <option value="3">3限</option>
          <option value="4">4限</option>
          <option value="5">5限</option>
          <option value="6">6限</option>
        </select>
      </div>

      <button class="add-btn" onclick="addClass()">登録する</button>
      <a href="index.html" class="link-btn">➔ 生徒用時間割を確認する</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
