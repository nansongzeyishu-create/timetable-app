<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>先生向け時間割・クラス管理アプリ</title>

  <!-- PWA（スマホでフルスクリーンアプリ化する設定） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="先生時間割">
  <meta name="theme-color" content="#2563eb">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .phone-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (min-width: 415px) {
      .phone-container {
        border-radius: 40px;
        height: 840px;
        border: 8px solid #ffffff;
      }
    }

    /* アプリメイン領域 */
    .app-body {
      flex: 1;
      overflow-y: auto;
      position: relative;
      padding-bottom: 20px;
      padding-top: 10px;
    }

    .tab-content {
      display: none;
      padding: 12px 16px;
    }

    .tab-content.active {
      display: block;
    }

    /* ヘッダーナビゲーション */
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      height: 40px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }

    /* 分かりやすいボタンデザイン */
    .action-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .action-btn:active {
      background: #1d4ed8;
      transform: scale(0.96);
    }

    .action-btn-secondary {
      background: #e2e8f0;
      color: #334155;
      box-shadow: none;
    }

    .action-btn-danger {
      background: #ef4444;
      color: white;
    }

    .icon-btn {
      font-size: 18px;
      cursor: pointer;
      color: #2563eb;
      padding: 6px 10px;
      border-radius: 10px;
      border: none;
      background: #eff6ff;
      font-weight: bold;
    }

    /* バナー */
    .teacher-banner {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 20px;
      padding: 16px;
      color: white;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .greeting-name {
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
    }

    .banner-sub {
      font-size: 12px;
      opacity: 0.9;
    }

    /* セクション */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
    }

    /* カード要素 */
    .class-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1.5px solid transparent;
      position: relative;
    }

    .class-card:active {
      border-color: #2563eb;
      background: #f8fafc;
    }

    .period-tag {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .p-1 { background-color: #3b82f6; }
    .p-2 { background-color: #22c55e; }
    .p-3 { background-color: #a855f7; }
    .p-4 { background-color: #f97316; }
    .p-5 { background-color: #ef4444; }

    .class-details { flex: 1; }
    .class-target { font-size: 15px; font-weight: 800; color: #0f172a; }
    .class-subject { font-size: 14px; font-weight: 700; color: #334155; margin-left: 6px; }
    .class-time { font-size: 12px; color: #64748b; margin-top: 2px; }

    .edit-badge {
      font-size: 11px;
      background: #eff6ff;
      color: #2563eb;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
    }

    /* フィルタータブ */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: #e2e8f0;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
    }

    /* クラスグリッド */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .class-box {
      background: white;
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
    }

    .class-box:active {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .class-box-name { font-size: 15px; font-weight: 800; color: #1e293b; }
    .class-box-count { font-size: 11px; color: #64748b; margin-top: 4px; }

    /* 生徒名簿 */
    .student-list {
      background: white;
      border-radius: 16px;
      padding: 6px 14px;
    }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .student-item:last-child { border-bottom: none; }
    .student-num { color: #94a3b8; width: 28px; font-weight: 600; }
    .student-name { flex: 1; font-weight: 700; color: #1e293b; }

    /* フォーム */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: white;
    }

    /* モーダルダイアログ */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-header {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    /* ボトムナビゲーション */
    .bottom-nav {
      height: 60px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      cursor: pointer;
      width: 20%;
      border: none;
      background: none;
    }

    .nav-item.active { color: #2563eb; }
    .nav-icon { font-size: 20px; }

    .setting-card {
      background: white;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
  </style>
</head>
<body>

    <!-- アプリ本文 -->

      <div id="tab-home" class="tab-content active">

          <div class="greeting-name" id="banner-teacher">田中 先生</div>

        <div id="today-classes"></div>
